# SwiftLint Configuration for SwiftTexMath

included:
  - Sources
  - Tests

excluded:
  - .build
  - third_party
  - .codegraph
  - Examples/SwiftTexMathDemo.xcodeproj

disabled_rules:
  - nesting
  - for_where

opt_in_rules:
  - empty_count
  - empty_string
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

# Rule configurations

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1000
  error: 1500

function_body_length:
  warning: 250
  error: 450

type_body_length:
  warning: 600
  error: 1000

cyclomatic_complexity:
  warning: 35
  error: 50

function_parameter_count:
  warning: 6
  error: 10

identifier_name:
  min_length: 1
  max_length:
    warning: 60
    error: 80
  allowed_symbols:
    - "_"

large_tuple:
  warning: 5
  error: 6

reporter: "xcode"
