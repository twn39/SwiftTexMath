# Main PR/push gate: Swift build & full test suite (no TeX install).
# TeX geometry oracle lives in .github/workflows/tex-oracle.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift ${{ matrix.swift }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        swift: ['6.1', '6.2']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Swift version
        run: swift --version

      - name: Build & test with code coverage
        run: swift test --enable-code-coverage --parallel

      - name: Code coverage report
        run: bash scripts/coverage.sh
